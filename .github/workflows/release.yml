name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish to Thunderstore, such as v1.13.22-pre. Thunderstore receives X.Y.Z.
        required: true
        type: string

jobs:
  release_on_thunderstore:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # Keep release publishing on the same repo-managed SDK line as global.json,
          # .codex/install.sh, and the main build workflow.
          dotnet-version: '8.0.x'

      - name: Select eligible release tag
        id: select_tag
        run: |
          requested_tag='${{ inputs.release_tag }}'

          # GitHub prerelease tags (vX.Y.Z-pre) can publish canonical Thunderstore package versions (X.Y.Z).
          # Feature-testing snapshots (v*-ft.*) are disposable CI artifacts and must never drive publication.
          allowed_tag_pattern='^v[0-9]+\.[0-9]+\.[0-9]+(-pre)?$'
          allowed_package_version_pattern='^[0-9]+\.[0-9]+\.[0-9]+$'

          if [[ -z "$requested_tag" ]]; then
            echo "Error: release_tag input is required." >&2
            exit 1
          fi

          if [[ ! "$requested_tag" =~ $allowed_tag_pattern ]]; then
            echo "Error: Release tag '$requested_tag' is not an allowed Thunderstore source tag." >&2
            echo "Expected one of: vX.Y.Z or vX.Y.Z-pre. Feature-testing tags such as v*-ft.* are intentionally excluded." >&2
            exit 1
          fi

          if ! git rev-parse -q --verify "refs/tags/$requested_tag" >/dev/null; then
            echo "Error: Release tag '$requested_tag' was not found in this checkout." >&2
            exit 1
          fi

          release_version="${requested_tag#v}"
          package_version="${release_version%-pre}"

          echo "Selected Thunderstore tag: $requested_tag"
          echo "GitHub release version: $release_version"
          echo "Thunderstore package version: $package_version"

          echo "RELEASE_TAG=$requested_tag" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "ALLOWED_TAG_PATTERN=$allowed_tag_pattern" >> "$GITHUB_ENV"
          echo "ALLOWED_PACKAGE_VERSION_PATTERN=$allowed_package_version_pattern" >> "$GITHUB_ENV"
        shell: bash

      - name: Preserve release helper scripts
        shell: bash
        run: |
          cp .codex/scripts/prerelease-notes.sh "$RUNNER_TEMP/prerelease-notes.sh"
          chmod +x "$RUNNER_TEMP/prerelease-notes.sh"

      - name: Checkout selected release tag
        shell: bash
        run: git checkout --detach "refs/tags/$RELEASE_TAG"

      - name: Validate selected release metadata
        id: version_metadata
        shell: bash
        run: ./.codex/scripts/version-metadata.sh

      - name: Confirm selected release version
        shell: bash
        run: |
          canonical_version='${{ steps.version_metadata.outputs.canonical_version }}'

          if [[ "$RELEASE_VERSION" != "$canonical_version" && "$RELEASE_VERSION" != "$canonical_version-pre" ]]; then
            echo "Error: Release tag '$RELEASE_TAG' does not align with canonical version '$canonical_version'." >&2
            exit 1
          fi

      - name: Download Release
        shell: bash
        run: |
          rm -rf ./dist
          gh release download "$RELEASE_TAG" -D ./dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}

      - name: Stage selected release contents
        shell: bash
        run: |
          publish_root="./dist/thunderstore-publish"
          required_release_assets=(
            "Bloodcraft.dll"
            "CHANGELOG.md"
          )
          required_checkout_assets=(
            "README.md"
            "icon.png"
            "thunderstore.toml"
          )

          rm -rf "$publish_root"
          mkdir -p "$publish_root/dist"

          for asset in "${required_release_assets[@]}"; do
            if [[ ! -f "./dist/$asset" ]]; then
              echo "Error: GitHub Release asset './dist/$asset' is missing." >&2
              exit 1
            fi

            cp "./dist/$asset" "$publish_root/dist/$asset"
          done

          for asset in "${required_checkout_assets[@]}"; do
            if [[ ! -f "$asset" ]]; then
              echo "Error: selected release checkout asset '$asset' is missing." >&2
              exit 1
            fi

            cp "$asset" "$publish_root/$asset"
          done

      - name: Validate staged release changelog
        shell: bash
        run: |
          bash "$RUNNER_TEMP/prerelease-notes.sh" \
            --changelog ./dist/thunderstore-publish/dist/CHANGELOG.md \
            --version "$PACKAGE_VERSION" \
            --tag "$RELEASE_TAG" \
            --check-only
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

      - name: Install Thunderstore CLI (tcli)
        run: dotnet tool install --global tcli --version 0.2.4

      - name: Build and verify Thunderstore package
        shell: bash
        run: |
          cd ./dist/thunderstore-publish
          tcli build --package-version "$PACKAGE_VERSION"

          package_file="$PWD/build/zfolmt-Bloodcraft-$PACKAGE_VERSION.zip"
          python3 - "$package_file" "$PACKAGE_VERSION" <<'PY'
          import json
          import sys
          from pathlib import Path
          from zipfile import ZipFile

          expected_files = {
              "Bloodcraft.dll": Path("dist/Bloodcraft.dll"),
              "CHANGELOG.md": Path("dist/CHANGELOG.md"),
              "README.md": Path("README.md"),
              "icon.png": Path("icon.png"),
          }
          with ZipFile(sys.argv[1]) as package:
              entries = package.namelist()
              expected_entries = set(expected_files) | {"manifest.json"}
              if len(entries) != len(expected_entries) or set(entries) != expected_entries:
                  raise SystemExit(f"Unexpected package contents: {entries}")
              manifest = json.loads(package.read("manifest.json"))
              if manifest.get("name") != "Bloodcraft" or manifest.get("version_number") != sys.argv[2]:
                  raise SystemExit(f"Unexpected package name or version: {manifest}")
              for name, source in expected_files.items():
                  contents = package.read(name)
                  if not contents or contents != source.read_bytes():
                      raise SystemExit(f"Package file is empty or differs from staged release: {name}")
              print(f"Verified package version {sys.argv[2]}: {', '.join(sorted(entries))}")
          PY
          echo "PACKAGE_FILE=$package_file" >> "$GITHUB_ENV"
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

      - name: Publish build to Thunderstore
        shell: bash
        run: |
          if [[ ! $RELEASE_TAG =~ $ALLOWED_TAG_PATTERN ]]; then
            echo "Error: Release tag '$RELEASE_TAG' is not an allowed Thunderstore source tag." >&2
            exit 1
          fi

          if [[ ! $PACKAGE_VERSION =~ $ALLOWED_PACKAGE_VERSION_PATTERN ]]; then
            echo "Error: Package version '$PACKAGE_VERSION' derived from '$RELEASE_TAG' is not an allowed Thunderstore package version." >&2
            exit 1
          fi

          echo "Publishing Thunderstore package version: $PACKAGE_VERSION"
          cd ./dist/thunderstore-publish
          tcli publish --token "$THUNDERSTORE_KEY" --package-version "$PACKAGE_VERSION" --file "$PACKAGE_FILE"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}
          ALLOWED_TAG_PATTERN: ${{ env.ALLOWED_TAG_PATTERN }}
          ALLOWED_PACKAGE_VERSION_PATTERN: ${{ env.ALLOWED_PACKAGE_VERSION_PATTERN }}
          THUNDERSTORE_KEY: ${{ secrets.THUNDERSTORE_KEY }}
